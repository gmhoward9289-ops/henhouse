[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "henhouse"
version = "0.1.0"
description = "Typed session and tool-call events from Claude Code / Cursor JSONL transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["claude", "claude-code", "cursor", "transcript", "jsonl", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Runtime is stdlib only. pytest is a test extra, never imported by henhouse.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/henhouse"
Issues = "https://github.com/gmhoward9289-ops/henhouse/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
