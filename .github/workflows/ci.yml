name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -v
      - name: CLI smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("fixture.jsonl")
          p.write_text('{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Write","input":{"file_path":"a.py"}}]}}\n', encoding="utf-8")
          PY
          python -m henhouse fixture.jsonl | python -c "import json,sys; d=json.load(sys.stdin); assert d['schema']=='henhouse.tools.v1' and d['calls'][0]['name']=='Write'"
